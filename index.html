<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.json">
<title>我的健康档案</title>
<style>
/* 全局苹果风重置 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;background:#f5f5f7;color:#1d1d1f}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:15px;touch-action:pan-y;line-height:1.4}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* 顶部导航 */
header{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;flex-shrink:0;
display:flex;justify-content:space-between;align-items:center;
position:sticky;top:0;z-index:20;border-bottom:0.5px solid #e5e5ea}
header h1{font-size:18px;font-weight:700;color:#1d1d1f}
.header-right{font-size:20px;color:#8e8e93;cursor:pointer;padding:4px}

/* 主内容区 */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.wrap{padding:16px;max-width:760px;margin:0 auto}

/* 底部导航 */
nav{display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
border-top:0.5px solid #e5e5ea;padding-bottom:env(safe-area-inset-bottom);
flex-shrink:0;position:relative;z-index:20}
nav button{flex:1;border:none;background:none;padding:6px 0 4px;font-size:10px;
color:#8e8e93;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button .ic svg{width:24px;height:24px;transition:all .2s}
nav button.on{color:#ff6b81;font-weight:600}
nav button .dot{position:absolute;top:6px;right:calc(50% - 12px);width:8px;height:8px;border-radius:50%;background:#ff3b30;display:none;border:1.5px solid #fff}
nav button .dot.on{display:block}

/* 卡片基础样式 */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.03);position:relative}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px;color:#1d1d1f}
.row{margin-top:8px;font-size:14px;line-height:1.6;color:#3a3a3c}
.row b{color:#1d1d1f;font-weight:500}
.acts{position:absolute;top:14px;right:14px;display:flex;gap:12px}
.acts button{background:none;border:none;font-size:13px;color:#007aff;padding:2px;cursor:pointer}
.acts button.del{color:#ff3b30}

/* 首页特调 */
.hero-card{background:linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
border-radius:20px;padding:20px;color:#fff;margin-bottom:16px;
box-shadow:0 8px 20px rgba(255,154,158,.3);position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;right:-20px;bottom:-20px;
width:120px;height:120px;background:rgba(255,255,255,.15);border-radius:50%;filter:blur(10px)}
.hero-card .title{font-size:14px;opacity:.9;margin-bottom:4px;font-weight:500}
.hero-card .val{font-size:26px;font-weight:700;margin-bottom:2px}
.hero-card .sub{font-size:13px;opacity:.85}
.hero-empty{background:#fff;border-radius:20px;padding:24px;text-align:center;color:#8e8e93;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}

/* 列表 & 标签 */
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:8px;
background:#ffeef0;color:#ff6b81;margin-right:6px;margin-top:8px;font-weight:500}
.tag.blue{background:#eef7ff;color:#007aff}
.tag.purple{background:#f3e8ff;color:#8a2be2}
.empty{text-align:center;color:#8e8e93;padding:50px 20px;font-size:14px}

/* 分段控制器 */
.seg{display:flex;background:#e3e3e8;border-radius:10px;padding:2px;margin:12px 16px 0}
.seg button{flex:1;border:none;background:none;padding:6px;border-radius:8px;
font-size:13px;color:#1d1d1f;cursor:pointer;transition:.2s}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 搜索框 */
.search-box{padding:8px 16px;background:#f5f5f7;position:sticky;top:0;z-index:10}
.search-box input{border-radius:12px;padding:10px 14px;background:#e3e3e8;border:none;font-size:15px;width:100%;outline:none}

/* 日历定制 */
.monthbar{display:flex;justify-content:space-between;align-items:center;padding:16px;font-size:18px;font-weight:600}
.monthbar button{border:none;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;color:#007aff;box-shadow:0 2px 6px rgba(0,0,0,.05);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 16px;touch-action:pan-y}
.cal .wd{text-align:center;font-size:12px;color:#8e8e93;padding:8px 0;font-weight:500}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:50%;color:#1d1d1f;cursor:pointer;transition:.1s}
.cal .d.blank{visibility:hidden;cursor:default}
.cal .d.p{background:#ff6b81;color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(255,107,129,.3)}
.cal .d.today{border:2px solid #007aff}

/* 时间轴 */
.tl{padding:10px 16px}
.tl .item{position:relative;padding:0 0 20px 22px;border-left:2px solid #e5e5ea;margin-left:6px}
.tl .item:last-child{border-left-color:transparent;padding-bottom:0}
.tl .item::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#ff6b81;border:2px solid #fff}
.tl .t{font-size:15px;font-weight:600}
.tl .s{font-size:13px;color:#8e8e93;margin-top:4px}
.tl .gap{font-size:12px;color:#ff6b81;background:#ffeef0;display:inline-block;padding:2px 8px;border-radius:8px;margin:6px 0 0 0;font-weight:500}

/* 表单弹窗 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:90;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#mask.on{display:block}
#panel{position:fixed;left:0;right:0;bottom:0;background:#f5f5f7;
border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;z-index:100;
transform:translateY(100%);transition:transform .3s cubic-bezier(0.32, 0.72, 0, 1);
padding:20px 16px calc(30px + env(safe-area-inset-bottom))}
#panel.on{transform:translateY(0)}
#panel h2{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center}
.field{margin-bottom:16px;background:#fff;border-radius:12px;padding:12px}
.field label{display:block;font-size:13px;color:#8e8e93;margin-bottom:6px;font-weight:500}
input,select,textarea{font-family:inherit;font-size:16px;border:none;background:transparent;width:100%;outline:none;color:#1d1d1f;padding:0}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:600;background:#007aff;color:#fff;margin-top:8px;cursor:pointer;transition:.2s}
.btn:active{opacity:.8}
.btn.sec{background:#e3e3e8;color:#1d1d1f}
.chip{display:inline-block;padding:8px 14px;border-radius:20px;background:#e3e3e8;font-size:14px;color:#1d1d1f;margin:0 8px 8px 0;cursor:pointer;border:1px solid transparent}
.chip.on{background:#ffeef0;color:#ff6b81;border-color:#ff6b81;font-weight:600}

/* 身体模块特调 */
.body-header{background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);color:#fff;padding:24px;text-align:center;border-radius:20px;margin-bottom:16px;box-shadow:0 8px 20px rgba(79,172,254,.3)}
.body-header .val{font-size:36px;font-weight:700;margin:8px 0}
.body-header .unit{font-size:16px;font-weight:400;opacity:.9}
.body-header .bmi{display:inline-block;background:rgba(255,255,255,.25);padding:6px 16px;border-radius:20px;font-size:14px;margin-top:12px;font-weight:500}
.nutri-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03);border-left:4px solid #34c759}
.nutri-card h4{font-size:16px;color:#1d1d1f;margin-bottom:6px}
.nutri-card p{font-size:14px;color:#666;line-height:1.5;margin-bottom:10px}
.food-tag{display:inline-block;background:#e8f8ee;color:#1a8c46;padding:4px 10px;border-radius:8px;font-size:12px;margin:4px 6px 0 0;font-weight:500}
#fab{position:fixed;right:20px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#ff6b81;color:#fff;font-size:32px;border:none;box-shadow:0 4px 14px rgba(255,107,129,.4);line-height:1;z-index:20;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:4px}
#fab:active{transform:scale(.95)}

/* 图片 */
.img-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;background:#e3e3e8;flex-shrink:0}
.img-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.img-thumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card-img{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card-img img{width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;background:#e3e3e8}
#imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:200;align-items:center;justify-content:center;padding:20px}
#imgViewer.on{display:flex}
#imgViewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#imgViewer .close{position:absolute;top:20px;right:20px;color:#fff;font-size:30px;background:rgba(255,255,255,.2);border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* 反推折叠 */
.infer-box{margin-top:12px;background:#fff9f0;border-radius:12px;padding:12px}
.infer-box summary{cursor:pointer;font-size:14px;font-weight:600;color:#d97706;outline:none;display:flex;align-items:center;gap:6px}
.infer-box summary::-webkit-details-marker{display:none}
.infer-box summary::before{content:'💡';font-size:16px}
.infer-content{font-size:13px;color:#92400e;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid #fef3c7}

/* 聊天 */
#chatScroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
#chatBar{flex-shrink:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid #e5e5ea;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.qq{display:inline-block;padding:6px 12px;background:#f5f5f7;border:1px solid #e5e5ea;border-radius:16px;font-size:13px;color:#007aff;margin:0 6px 8px 0;cursor:pointer;user-select:none}
.bubble-u{background:#007aff;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;margin:16px 0 16px auto;max-width:85%;width:fit-content;font-size:15px;line-height:1.5;word-break:break-word}
.bubble-b{background:#fff;border-radius:18px 18px 18px 4px;padding:16px;margin:0 auto 16px 0;max-width:90%;box-shadow:0 2px 10px rgba(0,0,0,.04);font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;font-family:Menlo,Monaco,monospace;color:#1d1d1f}
.copy-btn{margin-top:12px;padding:8px 16px;background:#f5f5f7;color:#007aff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.bubble-t{font-size:12px;color:#8e8e93;text-align:center;margin:16px 0 8px}
.chat-input-row{display:flex;gap:10px}
.chat-input-row input{flex:1;font-size:15px;padding:10px 16px;background:#f5f5f7;border-radius:20px}
.chat-input-row button{padding:0 20px;background:#007aff;color:#fff;border:none;border-radius:20px;font-size:15px;font-weight:600;flex-shrink:0}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:14px 24px;border-radius:12px;z-index:999;font-size:15px;pointer-events:none;backdrop-filter:blur(4px)}
</style>
</head>
<body>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

    <button data-v="home" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>首页</button>
    <button data-v="rec"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>档案</button>

<script>
let db = {events:[],periods:[],chats:[],messages:[],bodyRecords:[],settings:{remind:true, periodRemindDays:90}};

function initDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('HealthDB', 1);
    req.onupgradeneeded = e => { const d = e.target.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
    req.onsuccess = e => {
      const d = e.target.result;
      const tx = d.transaction('kv', 'readonly');
      const store = tx.objectStore('kv');
      const getReq = store.get('health_v1');
      getReq.onsuccess = () => {
        if(getReq.result) db = getReq.result;
        else {
          const old = localStorage.getItem('health_v1');
          if(old) { try { db = JSON.parse(old); saveDB(); localStorage.removeItem('health_v1'); } catch(err){} }
        }
        if(!db.events) db.events = [];
        if(!db.periods) db.periods = [];
        if(!db.chats) db.chats = [];
        if(!db.messages) db.messages = [];
        if(!db.bodyRecords) db.bodyRecords = [];
        if(!db.settings) db.settings = {remind:true};
        if(db.settings.periodRemindDays === undefined) db.settings.periodRemindDays = 90;
        resolve();
      };
      getReq.onerror = () => reject(getReq.error);
    };
    req.onerror = () => reject(req.error);
  });
}
function saveDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('HealthDB', 1);
    req.onsuccess = e => {
      const d = e.target.result;
      const tx = d.transaction('kv', 'readwrite');
      const store = tx.objectStore('kv');
      store.put(db, 'health_v1');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    };
  });
}

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function addDays(ds,n){
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function diffDays(a,b){
  const [y1,m1,d1]=a.split('-').map(Number);
  const [y2,m2,d2]=b.split('-').map(Number);
  return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000);
}
function fmtDate(ds){
  const [y,m,d]=ds.split('-').map(Number);
  return y+'年'+m+'月'+d+'日';
}
function perStart(p){return p.dates.slice().sort()[0];}
function perEnd(p){return p.dates.slice().sort().slice(-1)[0];}
function sortedPeriods(){return db.periods.slice().sort((a,b)=>perStart(a).localeCompare(perStart(b)));}

async function requestNotificationPermission() {
  if (!("Notification" in window)) { toast('您的浏览器不支持系统通知'); return false; }
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") { toast('通知权限已被拒绝'); return false; }
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function sendSystemNotification(title, body, tag) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try {
      const n = new Notification(title, { body: body, icon: "icon-192.png", tag: tag || "health-reminder", renotify: true });
      n.onclick = function() { window.focus(); this.close(); };
    } catch(e) {}
  }
}

const GENERIC_REASONS=['其他','常规体检','复查'];
function checkEventLinks(newEvent){
  if(!db.settings.remind) return;
  if(!newEvent.reasons || !newEvent.reasons.length) return;
  const myReasons=newEvent.reasons.filter(r=>!GENERIC_REASONS.includes(r));
  if(!myReasons.length) return;
  const links=[];
  db.events.forEach(e=>{
    if(e.id===newEvent.id) return;
    if(!e.reasons || !e.reasons.length) return;
    const common=e.reasons.filter(r=>myReasons.includes(r));
    if(common.length>0) links.push({event:e, common:common});
  });
  if(!links.length) return;
  links.sort((a,b)=>b.event.date.localeCompare(a.event.date));
  const top=links[0];
  if(db.messages.some(m=>m.type==='link' && m.srcId===newEvent.id)) return;
  const text='你刚记录的这次「'+myReasons.join('、')+'」，和 '+top.event.date+' 那次类似（都是「'+top.common.join('、')+'」）'+(top.event.diag?'，当时诊断：'+top.event.diag:'')+(top.event.hosp?'，在'+top.event.hosp:'')+'。';
  db.messages.push({ id:uid(), time:nowStr(), type:'link', text:text, refId:top.event.id, srcId:newEvent.id, read:false });
}

function checkPeriodRemind() {
  if(!db.settings.remind) return;
  const ps=sortedPeriods();
  if(ps.length<1) return;
  const last=ps[ps.length-1];
  const lastEnd=perEnd(last);
  const today=todayStr();
  const days=diffDays(lastEnd,today);
  const threshold = db.settings.periodRemindDays || 90;
  
  if(days<threshold) return;
  if(db.messages.some(m=>m.type==='period' && m.refId===last.id)) return;

  const msgText = '距离上次经期结束已经 '+days+' 天，达到了你设置的提醒间隔（'+threshold+'天）。最近有来吗？';
  db.messages.push({ id:uid(), time:nowStr(), type:'period', text: msgText + '有的话去日历点一下就好。', refId:last.id, read:false });
  saveDB();
  sendSystemNotification('🌸 经期提醒', msgText, 'period-remind-'+last.id);
  const unread = db.messages.filter(x=>!x.read).length;
  $('navDot').classList.toggle('on', unread>0);
}

function inferDiagnosis(medText, herbText) {
  let text = (medText || '') + ' ' + (herbText || '');
  text = text.toLowerCase();
  if(!text.trim()) return '';
  let results = [];
  const rules = [
    { keys:['奥美拉唑','阿莫西林','克拉霉素','甲硝唑','枸橼酸铋钾','果胶铋','雷贝拉唑','泮托拉唑'], desc:'常用于根除幽门螺杆菌（三联/四联疗法），或治疗胃炎、胃溃疡。' },
    { keys:['黄体酮','地屈孕酮','达英','优思明','达英-35','益母草','乌鸡白凤','芬吗通'], desc:'常用于调节内分泌、调理月经周期或缓解痛经。' },
    { keys:['布洛芬','对乙酰氨基酚','芬必得','双氯芬酸'], desc:'常见解热镇痛药，用于退烧、缓解头痛或痛经。' },
    { keys:['头孢','阿奇霉素','左氧氟沙星','青霉素','红霉素'], desc:'抗生素类药物，常用于治疗细菌感染（如呼吸道、泌尿系统感染）。' },
    { keys:['氯雷他定','西替利嗪','扑尔敏','依巴斯汀'], desc:'抗组胺药，通常用于缓解过敏性鼻炎、荨麻疹等过敏症状。' },
    { keys:['氨氯地平','硝苯地平','缬沙坦','美托洛尔','替米沙坦','厄贝沙坦'], desc:'心血管类药物，主要用于降血压或控制心率。' },
    { keys:['阿托伐他汀','瑞舒伐他汀','辛伐他汀'], desc:'降脂药，用于降低胆固醇和血脂。' },
    { keys:['柴胡','桂枝','当归','白芍','川芎','熟地黄','益母草','香附'], desc:'中药方剂中常见组合，常涉及疏肝解郁、活血化瘀或调理气血。' }
  ];
  rules.forEach(r => {
    let found = r.keys.filter(k => text.includes(k));
    if(found.length > 0) results.push(`发现「${found.join('、')}」：${r.desc}`);
  });
  if(results.length === 0) return (medText || herbText) ? '用药组合暂未匹配到内置常见知识库。建议复制具体药名到外部AI进行更细致的药理分析。' : '';
  return results.join('\n') + '\n（本地推测仅供参考，请以医生诊断为准，建议复制给云端AI进一步验证）';
}

function calHtml(){
  const first=new Date(calY,calM,1).getDay();
  const daysIn=new Date(calY,calM+1,0).getDate();
  const pmap={};
  db.periods.forEach(p=>p.dates.forEach(d=>pmap[d]=true));
  const today=todayStr();
  let h='<div class="monthbar"><button onclick="moveM(-1)">‹</button><span>'
    +calY+' 年 '+(calM+1)+' 月</span><button onclick="moveM(1)">›</button></div>';
  
  h+='<div class="cal" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event)">';
  h+=['日','一','二','三','四','五','六'].map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<first;i++) h+='<div class="d blank"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const cls='d'+(pmap[ds]?' p':'')+(ds===today?' today':'');
    h+='<div class="'+cls+'" onclick="toggleDay(\''+ds+'\')">'+d+'</div>';
  }
  h+='</div>';
  h+='<div style="text-align:center;font-size:13px;color:#8e8e93;padding:20px">点击打卡，连续多天自动合并<br>左右滑动可切换月份</div>';
  return h;
}
function moveM(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}tabPer(0);}
function toggleDay(ds){
  let foundIdx=-1;
  db.periods.forEach((p,i)=>{ if(p.dates.includes(ds)) foundIdx=i; });
  if(foundIdx>=0){
    const p=db.periods[foundIdx];
    p.dates=p.dates.filter(d=>d!==ds);
    if(!p.dates.length) db.periods.splice(foundIdx,1);
    saveDB(); render(); return;
  }
  const prev=db.periods.find(p=>p.dates.includes(addDays(ds,-1)));
  const next=db.periods.find(p=>p.dates.includes(addDays(ds,1)));
  if(prev && next && prev!==next){
    prev.dates=[...new Set([...prev.dates,...next.dates,ds])].sort();
    db.periods=db.periods.filter(p=>p!==next);
  } else if(prev){ prev.dates.push(ds); prev.dates.sort(); } 
  else if(next){ next.dates.push(ds); next.dates.sort(); } 
  else { db.periods.push({id:uid(),dates:[ds],flow:'',pain:'',note:''}); }
  saveDB(); render();
}

function rAssistant(m){
  const unread=db.messages.filter(x=>!x.read).length;
  let h='<div class="seg" style="margin-top:8px;flex-shrink:0">'
    +'<button class="'+(assistantTab==='chat'?'on':'')+'" onclick="setATab(\'chat\')">对话</button>'
    +'<button class="'+(assistantTab==='msg'?'on':'')+'" onclick="setATab(\'msg\')">通知'+(unread?' ('+unread+')':'')+'</button></div>';
  h+='<div id="assistantBody" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>';
  m.innerHTML=h;
  if(assistantTab==='chat') renderChat();
  else renderMessages();
}
function setATab(t){ assistantTab=t; rAssistant($('main')); }

function renderChat(){
  const body=$('assistantBody');
  let history='';
  if(!db.chats.length){
    history='<div style="text-align:center;font-size:13px;color:#8e8e93;padding:40px 20px;line-height:1.8">点下方问题快速生成，或自己输入。<br>助手会翻你本地档案，整理成一段文字。<br>你复制去问外面更强的 AI。</div>';
  } else {
    db.chats.forEach(c=>{
      history+='<div class="bubble-t">'+esc(c.time)+'</div>';
      history+='<div class="bubble-u">'+esc(c.question)+'</div>';
      history+='<div class="bubble-b">'+esc(c.summary)
        +'<button class="copy-btn" onclick="copyById(\''+c.id+'\')">复制这段</button>'
        +'<button class="copy-btn" style="color:#ff3b30;margin-left:8px" onclick="delChat(\''+c.id+'\')">删除</button>'
        +'</div>';
    });
  }
  body.innerHTML='<div id="chatScroll">'+history+'</div>'
    +'<div id="chatBar">'
    +'<div style="white-space:nowrap;overflow-x:auto;margin-bottom:8px">'
    +['最近经期怎么样？','以前胃痛过吗？','吃过哪些药？','有哪些中药？','整体健康状况'].map(q=>'<span class="qq" onclick="ask(\''+q+'\')">'+q+'</span>').join('')
    +'</div>'
    +'<div class="chat-input-row">'
    +'<input id="chatInput" placeholder="输入问题…" onkeydown="if(event.key===\'Enter\')ask()">'
    +'<button onclick="ask()">发送</button>'
    +'</div>'
    +'</div>';
  setTimeout(()=>{const s=$('chatScroll');if(s)s.scrollTop=s.scrollHeight;},60);
}
function ask(preset){
  const inp=$('chatInput');
  const q=(preset!=null?preset:(inp?inp.value.trim():''));
  if(!q){toast('请输入问题');return;}
  if(inp) inp.value='';
  const summary=buildSummary(q);
  db.chats.push({id:uid(),time:nowStr(),question:q,summary:summary});
  saveDB(); renderChat();
}
function copyById(id){ const c=db.chats.find(x=>x.id===id); if(c) copyText(c.summary); }
function delChat(id){ if(!confirm('删除这条对话？'))return; db.chats=db.chats.filter(x=>x.id!==id); saveDB(); renderChat(); }

function buildSummary(question){
  const q=question;
  const wantPeriod=/经期|月经|例假|生理期|痛经/.test(q);
  const wantHerb=/中药|中医|汤药|方剂|方子/.test(q);
  const wantMed=/(吃过|吃了|用过|服用).*药/.test(q) && !wantHerb;
  const wantAll=/整体|全部|所有|综合|总体|概况|健康状况/.test(q);
  const hitWords=['胃痛','胃镜','胃炎','胃','反酸','腹胀','消化','腹痛','头痛','头晕','失眠','睡眠','睡不着','疲劳','乏力','感冒','发烧','咳嗽','血压','血糖','血脂','心悸','胸闷','腰痛','关节','过敏','甲状腺','激素','体检','复查','痛经'].filter(w=>q.includes(w));

  const lines=[]; let hasContent=false;
  if(wantPeriod){
    const ps=sortedPeriods();
    if(ps.length){
      hasContent=true; const recent=ps.slice(-10).reverse();
      lines.push('【经期记录】共 '+ps.length+' 次，列出最近 '+recent.length+' 次：');
      recent.forEach((p,i)=>{
        const s=perStart(p), e=perEnd(p);
        let sLine='- '+s+(s!==e?' 至 '+e:'')+'，持续 '+p.dates.length+' 天';
        if(p.flow) sLine+='，量'+p.flow; if(p.pain) sLine+='，痛经'+p.pain; if(p.note) sLine+='。'+p.note;
        if(i<recent.length-1){ const prev=recent[i+1]; sLine+='（距上次结束 '+diffDays(perEnd(prev),s)+' 天）'; }
        lines.push(sLine);
      });
      if(ps.length>=3){
        const gaps=[]; for(let i=1;i<ps.length;i++) gaps.push(diffDays(perEnd(ps[i-1]),perStart(ps[i])));
        lines.push('间隔统计：平均 '+Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length)+' 天。');
      }
      lines.push('');
    }
  }
  if(wantHerb){
    const herbs=db.events.filter(e=>e.herb).sort((a,b)=>a.date.localeCompare(b.date));
    if(herbs.length){ hasContent=true; lines.push('【中药调理记录】共 '+herbs.length+' 次：');
      herbs.forEach(e=>{
        let s='- '+e.date;
        if((e.reasons||[]).length) s+='，因'+e.reasons.join('、'); if(e.diag) s+='，诊断：'+e.diag;
        if(e.herbFormula) s+='，方剂：'+e.herbFormula.replace(/\n/g,'；'); if(e.med) s+='，西药：'+e.med.replace(/\n/g,'；');
        lines.push(s);
      }); lines.push('');
    }
  }
  if(wantMed && !wantHerb){
    const meds=db.events.filter(e=>e.med && e.med.trim()).sort((a,b)=>a.date.localeCompare(b.date));
    if(meds.length){ hasContent=true; lines.push('【用药记录】共 '+meds.length+' 次：');
      meds.forEach(e=>{ lines.push('- '+e.date+(e.diag?'（'+e.diag+'）':'')+'：'+e.med.replace(/\n/g,'；')); }); lines.push('');
    }
  }
  if(hitWords.length){
    const matched=db.events.filter(e=>hitWords.some(w=>[(e.reasons||[]).join(' '),e.diag,e.exam,e.med,e.feel,e.dept,e.hosp,e.herbFormula||''].join(' ').includes(w)));
    if(matched.length){ hasContent=true; lines.push('【相关就诊记录】共 '+matched.length+' 条：');
      matched.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        let s='- '+e.date+'：'+(e.diag||e.reasons.join('、'));
        if(e.med) s+='，用药：'+e.med.replace(/\n/g,'；'); if(e.feel) s+='。'+e.feel;
        lines.push(s);
      }); lines.push('');
    }
  }
  if(wantAll || !hasContent){
    const recent=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
    lines.push('【整体概况】共 '+db.events.length+' 条记录，'+db.periods.length+' 次经期。');
    if(db.bodyRecords && db.bodyRecords.length > 0) {
       const b = db.bodyRecords.sort((a,b)=>b.date.localeCompare(a.date))[0];
       lines.push('最新身高 '+b.height+'cm，体重 '+b.weight+'kg。');
    }
    lines.push('');
    if(recent.length){ lines.push('【最近记录】');
      recent.forEach(e=>{ lines.push('- '+e.date+'：'+((e.reasons||[]).join('、')||e.diag||'记录')+(e.med?'（用药:'+e.med+')':'')); }); lines.push('');
    }
    if(db.periods.length){ lines.push('【经期汇总】共记录 '+db.periods.length+' 次。最近一次开始于 '+perStart(sortedPeriods().slice(-1)[0])+'。'); }
  }
  lines.push('请分析：'+question);
  return lines.join('\n');
}

function renderMessages(){
  const body=$('assistantBody');
  const list=db.messages.slice().sort((a,b)=>b.time.localeCompare(a.time));
  let h='<div style="flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch">';
  h+='<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div><div style="font-weight:600">系统提醒</div><div style="font-size:12px;color:#8e8e93;margin-top:2px">开启后可弹窗</div></div>'
    +'<label class="switch" style="margin:0"><input type="checkbox" id="remindSwitch" '+(db.settings.remind?'checked':'')+' onchange="toggleRemind(this.checked)"><span class="sl"></span></label>'
    +'</div>';
  if(db.settings.remind) {
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid #f0f0f3;padding-top:12px">'
      +'<div style="font-size:14px">经期提醒间隔</div>'
      +'<div style="display:flex;align-items:center;gap:6px;font-size:14px">'
      +'<input type="number" id="remindDaysInput" value="'+(db.settings.periodRemindDays||90)+'" onchange="updateRemindDays(this.value)" style="width:50px;text-align:center;border:1px solid #e5e5ea;border-radius:6px;padding:4px"> 天'
      +'</div></div>';
  }
  h+='</div>';
  if(!list.length){
    h+='<div class="empty" style="padding:20px">暂无消息</div>';
  } else {
    list.forEach(m=>{
      h+='<div class="card" style="'+(m.read?'':'border-left:3px solid #007aff')+'">'
        +'<div style="font-size:12px;color:#8e8e93;margin-bottom:6px">'+esc(m.time)+'</div>'
        +'<div style="font-size:14px;line-height:1.6">'+esc(m.text)+'</div>'
        +'<div style="margin-top:10px;display:flex;gap:10px">'
        +(m.type==='link'?'<button style="padding:6px 12px;background:#f5f5f7;border:none;border-radius:8px;color:#007aff" onclick="jumpTo(\''+m.refId+'\',\''+m.id+'\')">查看记录</button>':'')
        +(m.type==='period'?'<button style="padding:6px 12px;background:#f5f5f7;border:none;border-radius:8px;color:#007aff" onclick="goCalendar(\''+m.id+'\')">去日历</button>':'')
        +'<button style="padding:6px 12px;background:#f5f5f7;border:none;border-radius:8px;color:#8e8e93" onclick="delMsg(\''+m.id+'\')">删除</button>'
        +'</div></div>';
    });
  }
  h+='</div>';
  body.innerHTML=h;
  if(db.messages.some(x=>!x.read)){
    db.messages.forEach(x=>x.read=true); saveDB();
    setTimeout(()=>{ if(db.messages.filter(x=>!x.read).length===0) $('navDot').classList.remove('on'); },100);
  }
}
async function toggleRemind(on){ 
  if(on) { const granted = await requestNotificationPermission(); if(!granted) { toast('未开启通知权限'); db.settings.remind = false; saveDB(); renderMessages(); return; } }
  db.settings.remind=on; saveDB(); toast(on?'已开启':'已关闭'); renderMessages();
}
function updateRemindDays(val) {
  let n = parseInt(val); if(isNaN(n) || n < 15) { toast('不能少于15天，重置为90'); n = 90; }
  db.settings.periodRemindDays = n; saveDB(); toast('间隔设为 '+n+' 天'); renderMessages();
}
function delMsg(id){ db.messages=db.messages.filter(x=>x.id!==id); saveDB(); renderMessages(); }
function jumpTo(refId,msgId){ const ev=db.events.find(x=>x.id===refId); if(!ev){toast('找不到记录');return;} evForm(ev); }
function goCalendar(msgId){ db.messages=db.messages.filter(x=>x.id!==msgId); saveDB(); assistantTab='chat'; view='per'; render(); }

function exp(){
  const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='健康档案备份_'+todayStr()+'.json';a.click();
}
function imp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o.events||!o.periods) throw 0;
      if(confirm('导入 '+o.events.length+' 条事件？\n确定=合并，取消=覆盖')){
        const ids=new Set(db.events.map(x=>x.id)); o.events.forEach(x=>{if(!ids.has(x.id))db.events.push(x);});
        const pids=new Set(db.periods.map(x=>x.id)); o.periods.forEach(x=>{if(!pids.has(x.id))db.periods.push(x);});
        if(o.chats) { const c=new Set(db.chats.map(x=>x.id)); o.chats.forEach(x=>{if(!c.has(x.id))db.chats.push(x);}); }
        if(o.messages) { const m=new Set(db.messages.map(x=>x.id)); o.messages.forEach(x=>{if(!m.has(x.id))db.messages.push(x);}); }
        if(o.bodyRecords) { const b=new Set(db.bodyRecords.map(x=>x.id)); o.bodyRecords.forEach(x=>{if(!b.has(x.id))db.bodyRecords.push(x);}); }
      } else { db=o; if(!db.chats)db.chats=[]; if(!db.messages)db.messages=[]; if(!db.bodyRecords)db.bodyRecords=[]; if(!db.settings)db.settings={remind:true}; }
      saveDB(); render(); alert('导入完成');
    }catch(err){alert('文件格式不对');}
  };
  r.readAsText(f);e.target.value='';
}
function clr(){
  const txt = prompt('【危险操作】这将删除所有数据，无法恢复！\n\n如果确定，请输入"确认清空"四个字：');
  if(txt === '确认清空') {
    db={events:[],periods:[],chats:[],messages:[],bodyRecords:[],settings:{remind:true, periodRemindDays:90}};
    saveDB(); toast('已清空'); view='home'; render();
  } else if (txt !== null) {
    toast('输入错误，取消清空');
  }
}

function viewIdx(i){ $('imgViewerImg').src=editingImages[i]; $('imgViewer').classList.add('on'); }

  const ev=db.events.find(x=>x.id===evId);
  if(ev && ev.images && ev.images[i]){ $('imgViewerImg').src=ev.images[i]; $('imgViewer').classList.add('on'); }
}
function closeViewer(){ $('imgViewer').classList.remove('on'); }
function compressImage(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height; const max=1600;
        if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.8));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onPickImages(e){
  const files=[...e.target.files]; if(!files.length) return;
  toast('处理图片中…');
  for(const f of files){ try{ const b64=await compressImage(f); editingImages.push(b64); }catch(err){} }
  e.target.value=''; renderImgPreviews();
}
function saveEv(){
  const date=$('f_date').value; if(!date){alert('请选日期');return;}
  const reasons=[...document.querySelectorAll('#chips .chip.on')].map(c=>c.textContent);
  const r2=$('f_reason2').value.trim(); if(r2) reasons.push(r2);
  const medVal = $('f_med').value.trim(), herbVal = $('f_herbformula').value.trim();
  const inferred = inferDiagnosis(medVal, herbVal);
  const isNew=!editing;
  const o={ id:editing||uid(), date:date, dept:$('f_dept').value.trim(), hosp:$('f_hosp').value.trim(), reasons:reasons, reason2:'', exam:$('f_exam').value.trim(), diag:$('f_diag').value.trim(), med:medVal, feel:$('f_feel').value.trim(), herb:$('f_herb').checked, herbFormula:herbVal, images:editingImages.slice(), inferred: inferred };
  if(editing) db.events=db.events.map(x=>x.id===editing?o:x); else db.events.push(o);
  if(isNew) checkEventLinks(o); saveDB();closeP();render();
}
function editEv(id){const ev=db.events.find(x=>x.id===id);if(ev)evForm(ev);}
function delEv(id){ if(!confirm('删除这条记录？'))return; db.events=db.events.filter(x=>x.id!==id); saveDB();render(); }

function perForm(p){
  editing=p?p.id:null;
  const s=perStart(p), e=perEnd(p);
  openP('<h2>经期细节</h2>'
    +'<div style="text-align:center;color:#8e8e93;font-size:14px;margin-bottom:16px">'+fmtDate(s)+(s!==e?' → '+fmtDate(e):'')+'（共 '+p.dates.length+' 天）</div>'
    +'<div class="field"><label>流量</label><select id="p_flow">'+['','少','中','多'].map(v=>'<option '+(p.flow===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>痛经</label><select id="p_pain">'+['无','轻','中','重'].map(v=>'<option '+(p.pain===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>备注</label><textarea id="p_note" rows="2">'+esc(p.note)+'</textarea></div>'
    +'<button class="btn" onclick="savePer()">保存</button>'
    +'<button class="btn sec" onclick="closeP()">取消</button>');
}
function savePer(){
  const p=db.periods.find(x=>x.id===editing); if(!p){closeP();return;}
  p.flow=$('p_flow').value; p.pain=$('p_pain').value; p.note=$('p_note').value.trim();
  saveDB();closeP();render();
}
function editPer(id){const p=db.periods.find(x=>x.id===id);if(p)perForm(p);}
function delPer(id){if(!confirm('删除这次经期？'))return;db.periods=db.periods.filter(x=>x.id!==id);saveDB();render();}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});

initDB().then(()=>{ checkPeriodRemind(); render(); }).catch(err=>{ alert('数据库初始化失败，请刷新'); });
</script>
