<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.json">
<title>我的健康档案</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
background:#f2f3f5;color:#1c1c1e;font-size:15px;touch-action:pan-y}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:#0a84ff;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.15)}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
nav{display:flex;background:#fff;border-top:1px solid #e5e5ea;
padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
nav button{flex:1;border:none;background:none;padding:8px 0 6px;font-size:11px;
color:#8e8e93;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:#0a84ff}
nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);
width:8px;height:8px;border-radius:50%;background:#ff3b30;display:none}
nav button .dot.on{display:block}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.card .date{font-size:13px;color:#0a84ff;font-weight:600}
.card .hosp{font-size:13px;color:#8e8e93;margin-top:2px}
.card h3{font-size:16px;font-weight:600;margin:8px 0 4px}
.row{margin-top:8px;font-size:14px;line-height:1.6;color:#3a3a3c}
.row b{color:#1c1c1e}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
background:#eaf3ff;color:#0a84ff;margin-right:6px;margin-top:6px}
.tag.g{background:#e8f8ee;color:#1a8c46}
.acts{position:absolute;top:12px;right:12px;display:flex;gap:10px}
.acts button{background:none;border:none;font-size:13px;color:#8e8e93;padding:2px}
.acts button.del{color:#ff3b30}
.empty{text-align:center;color:#8e8e93;padding:50px 20px;line-height:1.8;font-size:14px}
.seg{display:flex;background:#e9e9eb;border-radius:9px;padding:3px;margin:12px 12px 0}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:7px;
font-size:14px;color:#3a3a3c;cursor:pointer}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat .big{font-size:15px;font-weight:600;margin-bottom:8px}
.stat .line{font-size:14px;color:#3a3a3c;line-height:1.9;display:flex;justify-content:space-between}
.stat .line span:last-child{color:#0a84ff;font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom));
width:56px;height:56px;border-radius:50%;background:#0a84ff;color:#fff;
font-size:30px;border:none;box-shadow:0 4px 14px rgba(10,132,255,.45);line-height:1;z-index:20}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
#mask.on{display:block}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;
border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;z-index:31;
transform:translateY(100%);transition:transform .25s;
padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
#panel.on{transform:translateY(0)}
#panel h2{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#8e8e93;margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid #d1d1d6;
border-radius:8px;padding:9px 10px;background:#fff;width:100%;outline:none;color:#1c1c1e}
input:focus,select:focus,textarea:focus{border-color:#0a84ff}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:16px;
font-weight:600;background:#0a84ff;color:#fff;margin-top:6px}
.btn.sec{background:#f0f0f3;color:#1c1c1e;margin-top:8px}
.chip{display:inline-block;padding:7px 12px;border-radius:18px;background:#f0f0f3;
font-size:13px;color:#3a3a3c;margin:0 6px 6px 0;cursor:pointer;border:1px solid transparent}
.chip.on{background:#eaf3ff;color:#0a84ff;border-color:#0a84ff}
.monthbar{display:flex;justify-content:space-between;align-items:center;
padding:12px;font-size:16px;font-weight:600}
.monthbar button{border:none;background:#f0f0f3;border-radius:8px;
width:36px;height:36px;font-size:18px;color:#0a84ff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px}
.cal .wd{text-align:center;font-size:12px;color:#8e8e93;padding:6px 0}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
font-size:14px;border-radius:50%;color:#1c1c1e;cursor:pointer;
transition:background .15s}
.cal .d.blank{visibility:hidden;cursor:default}
.cal .d.p{background:#ff5c8a;color:#fff;font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px #0a84ff}
.tl{padding:6px 12px}
.tl .item{position:relative;padding:0 0 20px 22px;border-left:2px solid #d1d1d6;margin-left:6px}
.tl .item:last-child{border-left-color:transparent;padding-bottom:6px}
.tl .item::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;
border-radius:50%;background:#ff5c8a;border:2px solid #fff}
.tl .t{font-size:14px;font-weight:600}
.tl .s{font-size:13px;color:#8e8e93;margin-top:4px;line-height:1.7}
.tl .gap{font-size:12px;color:#c2185b;background:#ffe8ee;
display:inline-block;padding:2px 8px;border-radius:10px;margin:4px 0 0 0}
.hint{font-size:12px;color:#8e8e93;text-align:center;padding:12px}
#chatScroll{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
#chatBar{flex-shrink:0;background:#fff;border-top:1px solid #e5e5ea;
padding:8px 12px;padding-bottom:8px}
.qq{display:inline-block;padding:5px 11px;background:#f0f0f3;border-radius:14px;
font-size:12px;color:#0a84ff;margin:0 6px 6px 0;cursor:pointer;user-select:none}
.qq:active{background:#e0e0e5}
.bubble-u{background:#0a84ff;color:#fff;border-radius:16px 16px 4px 16px;
padding:10px 13px;margin:10px 0 10px auto;max-width:82%;width:fit-content;
font-size:14px;line-height:1.5;word-break:break-word}
.bubble-b{background:#fff;border-radius:16px 16px 16px 4px;
padding:13px;margin:10px auto 10px 0;max-width:96%;
box-shadow:0 1px 3px rgba(0,0,0,.06);
font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",monospace;color:#1c1c1e}
.copy-btn{margin-top:10px;padding:9px 16px;background:#0a84ff;color:#fff;
border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.copy-btn:active{background:#0070e0}
.bubble-t{font-size:11px;color:#8e8e93;text-align:center;margin:14px 0 4px}
.chat-hint{text-align:center;font-size:12px;color:#8e8e93;padding:20px 30px;line-height:1.8}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;font-size:15px;padding:9px 12px}
.chat-input-row button{padding:0 18px;background:#0a84ff;color:#fff;border:none;
border-radius:8px;font-size:14px;font-weight:600;flex-shrink:0}
.chat-input-row button:active{background:#0070e0}
.switch-row{display:flex;align-items:center;justify-content:space-between;
background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(0,0,0,.06)}
.switch-row .lbl{font-size:15px;color:#1c1c1e}
.switch-row .sub2{font-size:12px;color:#8e8e93;margin-top:3px}
.switch{position:relative;width:50px;height:30px;flex-shrink:0;margin-left:12px}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#e9e9eb;border-radius:15px;
transition:.2s;cursor:pointer}
.switch .sl::before{content:'';position:absolute;width:26px;height:26px;
left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;
box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:#34c759}
.switch input:checked + .sl::before{transform:translateX(20px)}
.msg-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.msg-card.unread{border-left:3px solid #0a84ff}
.msg-card .mt{font-size:12px;color:#8e8e93;margin-bottom:6px}
.msg-card .mx{font-size:14px;line-height:1.65;color:#1c1c1e}
.msg-card .mact{margin-top:10px;display:flex;gap:8px}
.msg-card .mact button{padding:7px 14px;border-radius:8px;border:none;
font-size:13px;cursor:pointer}
.msg-card .mact .go{background:#eaf3ff;color:#0a84ff;font-weight:600}
.msg-card .mact .del{background:#f0f0f3;color:#8e8e93}
.msg-badge{display:inline-block;background:#ff3b30;color:#fff;font-size:10px;
padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle}
/* 中药档案 */
.herb-timeline{padding:6px 12px}
.herb-item{position:relative;padding:0 0 18px 22px;border-left:2px solid #d9c4f0;margin-left:6px}
.herb-item:last-child{border-left-color:transparent;padding-bottom:6px}
.herb-item::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;
border-radius:50%;background:#9b59d0;border:2px solid #fff}
.herb-item .ht{font-size:14px;font-weight:600;color:#5a2a8c}
.herb-item .hd{font-size:12px;color:#8e8e93;margin-top:3px;line-height:1.6}
.herb-item .hf{margin-top:6px;padding:8px 10px;background:#f9f3ff;border-radius:8px;
font-size:13px;color:#4a1f75;line-height:1.6;white-space:pre-wrap}
.herb-item .hact{margin-top:8px;display:flex;gap:14px;font-size:12px}
.herb-item .hact button{background:none;border:none;color:#8e8e93;padding:2px}
.herb-item .hact button.del{color:#ff3b30}
.herb-summary{background:#f9f3ff;border-radius:12px;padding:14px;margin:12px;
color:#4a1f75;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="ttl">我的健康档案</h1>
    <div class="sub" id="sub">数据仅存本机</div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-v="home" class="on"><span class="ic">🏠</span>首页</button>
    <button data-v="rec"><span class="ic">📁</span>档案</button>
    <button data-v="per"><span class="ic">🌸</span>经期</button>
    <button data-v="chat"><span class="ic">💬</span>助手<span class="dot" id="navDot"></span></button>
    <button data-v="set"><span class="ic">⚙️</span>设置</button>
  </nav>
</div>
<button id="fab">+</button>
<div id="mask"></div>
<div id="panel"></div>

<script>
const K='health_v1';
let db=JSON.parse(localStorage.getItem(K)||'null')||{events:[],periods:[],chats:[],messages:[],settings:{remind:true}};
if(!db.chats) db.chats=[];
if(!db.messages) db.messages=[];
if(!db.settings) db.settings={remind:true};

if(db.periods && db.periods.length && db.periods[0].start !== undefined){
  db.periods=db.periods.map(p=>{
    const dates=[];
    if(p.start){
      let d=p.start;
      const end=p.end||p.start;
      while(d<=end){dates.push(d);d=addDays(d,1);}
    }
    return {id:p.id||uid(), dates:dates, flow:p.flow||'', pain:p.pain||'', note:p.note||''};
  });
  save();
}

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){localStorage.setItem(K,JSON.stringify(db));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function addDays(ds,n){
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function diffDays(a,b){
  const [y1,m1,d1]=a.split('-').map(Number);
  const [y2,m2,d2]=b.split('-').map(Number);
  return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000);
}
function fmtDate(ds){
  const [y,m,d]=ds.split('-').map(Number);
  return y+'年'+m+'月'+d+'日';
}
function perStart(p){return p.dates.slice().sort()[0];}
function perEnd(p){return p.dates.slice().sort().slice(-1)[0];}
function sortedPeriods(){return db.periods.slice().sort((a,b)=>perStart(a).localeCompare(perStart(b)));}

function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:12px 22px;border-radius:10px;z-index:999;font-size:14px;pointer-events:none';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}
function copyText(text){
  const done=()=>toast('已复制到剪贴板');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('复制失败，请长按选中');}
  document.body.removeChild(ta);
}

const GENERIC_REASONS=['其他','常规体检','复查'];
function checkEventLinks(newEvent){
  if(!db.settings.remind) return;
  if(!newEvent.reasons || !newEvent.reasons.length) return;
  const myReasons=newEvent.reasons.filter(r=>!GENERIC_REASONS.includes(r));
  if(!myReasons.length) return;
  const links=[];
  db.events.forEach(e=>{
    if(e.id===newEvent.id) return;
    if(!e.reasons || !e.reasons.length) return;
    const common=e.reasons.filter(r=>myReasons.includes(r));
    if(common.length>0) links.push({event:e, common:common});
  });
  if(!links.length) return;
  links.sort((a,b)=>b.event.date.localeCompare(a.event.date));
  const top=links[0];
  if(db.messages.some(m=>m.type==='link' && m.srcId===newEvent.id)) return;
  const text='你刚记录的这次「'+myReasons.join('、')+'」，和 '+top.event.date+' 那次类似'
    +'（都是「'+top.common.join('、')+'」）'
    +(top.event.diag?'，当时诊断：'+top.event.diag:'')
    +(top.event.hosp?'，在'+top.event.hosp:'')
    +'。';
  db.messages.push({
    id:uid(), time:nowStr(), type:'link',
    text:text, refId:top.event.id, srcId:newEvent.id, read:false
  });
}
function checkPeriodRemind(){
  if(!db.settings.remind) return;
  const ps=sortedPeriods();
  if(ps.length<1) return;
  const last=ps[ps.length-1];
  const lastEnd=perEnd(last);
  const today=todayStr();
  const days=diffDays(lastEnd,today);
  let threshold=40;
  if(ps.length>=3){
    const gaps=[];
    for(let i=1;i<ps.length;i++) gaps.push(diffDays(perEnd(ps[i-1]),perStart(ps[i])));
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    threshold=Math.max(35,Math.round(avg*1.5));
  }
  if(days<threshold) return;
  if(db.messages.some(m=>m.type==='period' && m.refId===last.id)) return;
  db.messages.push({
    id:uid(), time:nowStr(), type:'period',
    text:'距离上次经期结束已经 '+days+' 天，比平时的间隔长了一些。最近有来吗？有的话去日历点一下就好。',
    refId:last.id, read:false
  });
  save();
}

let view='home', calY, calM, editing=null, assistantTab='chat', recTab=0;

function render(){
  const m=$('main');
  if(view==='chat'){
    m.style.overflow='hidden'; m.style.display='flex'; m.style.flexDirection='column';
  } else {
    m.style.overflow='auto'; m.style.display=''; m.scrollTop=0;
  }
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('fab').style.display=(view==='home'||view==='rec')?'block':'none';
  if(view==='home') rHome(m);
  if(view==='rec') rRec(m);
  if(view==='per') rPer(m);
  if(view==='chat') rAssistant(m);
  if(view==='set') rSet(m);
  $('sub').textContent='数据仅存本机 · '+db.events.length+' 条事件 · '+db.periods.length+' 次经期';
  const unread=db.messages.filter(x=>!x.read).length;
  $('navDot').classList.toggle('on', unread>0);
}

function rHome(m){
  const ps=sortedPeriods();
  const p=ps.slice(-1)[0];
  const ev=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  let h='<div class="wrap">';
  h+='<div class="stat"><div class="big">现在</div>';
  if(p){
    const s=perStart(p), e=perEnd(p);
    const today=todayStr();
    const dur=p.dates.length;
    const sinceEnd=diffDays(e,today);
    if(e>=today){
      h+='<div class="line"><span>本次经期</span><span>进行中</span></div>';
      h+='<div class="line"><span>已持续</span><span>'+dur+' 天</span></div>';
    } else {
      h+='<div class="line"><span>最近一次经期</span><span>'+fmtDate(s)+'</span></div>';
      h+='<div class="line"><span>持续</span><span>'+dur+' 天</span></div>';
      h+='<div class="line"><span>距结束已过</span><span>'+sinceEnd+' 天</span></div>';
    }
  }else{
    h+='<div class="line"><span>经期</span><span>还没有记录</span></div>';
  }
  if(ev){
    h+='<div class="line" style="margin-top:6px"><span>最近就诊</span><span>'+esc(ev.date)+'</span></div>';
  }
  h+='</div>';
  const list=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  h+='<div class="card"><h3 style="margin:0 0 6px">最近的事件</h3>';
  if(!list.length) h+='<div class="empty" style="padding:20px">还没有记录，点右下角 + 添加</div>';
  list.forEach(e=>{
    h+='<div class="row" style="border-top:1px solid #f0f0f3;padding-top:8px">'
      +'<b>'+esc(e.date)+'</b> · '+esc((e.reasons||[]).join('、')||e.diag||'记录')
      +(e.hosp?' <span style="color:#8e8e93">'+esc(e.hosp)+'</span>':'')+'</div>';
  });
  h+='</div></div>';
  m.innerHTML=h;
}

function rRec(m){
  let h='<div class="seg" style="margin-top:12px">'
    +'<button class="'+(recTab===0?'on':'')+'" onclick="tabRec(0)">主档案</button>'
    +'<button class="'+(recTab===1?'on':'')+'" onclick="tabRec(1)">中药</button></div><div id="recBody"></div>';
  m.innerHTML=h; tabRec(recTab);
}
function tabRec(i){
  recTab=i;
  document.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',i===j));
  const body=$('recBody');
  if(i===0){
    const list=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date));
    if(!list.length){body.innerHTML='<div class="empty">还没有事件记录<br>点右下角 + 添加</div>';return;}
    body.innerHTML='<div class="wrap">'+list.map(ev=>evCard(ev)).join('')+'</div>';
  } else {
    body.innerHTML=herbHtml();

function calHtml(){
  const first=new Date(calY,calM,1).getDay();
  const daysIn=new Date(calY,calM+1,0).getDate();
  const pmap={};
  db.periods.forEach(p=>p.dates.forEach(d=>pmap[d]=true));
  const today=todayStr();
  let h='<div class="monthbar"><button onclick="moveM(-1)">‹</button><span>'
    +calY+' 年 '+(calM+1)+' 月</span><button onclick="moveM(1)">›</button></div>';
  h+='<div class="cal">'+['日','一','二','三','四','五','六'].map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<first;i++) h+='<div class="d blank"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const cls='d'+(pmap[ds]?' p':'')+(ds===today?' today':'');
    h+='<div class="'+cls+'" onclick="toggleDay(\''+ds+'\')">'+d+'</div>';
  }
  h+='</div>';
  h+='<div class="hint">点击某一天即可标记/取消经期。连续多天会自动合并为一次经期。</div>';
  return h;
}
function moveM(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}tabPer(0);}

function toggleDay(ds){
  let foundIdx=-1;
  db.periods.forEach((p,i)=>{ if(p.dates.includes(ds)) foundIdx=i; });
  if(foundIdx>=0){
    const p=db.periods[foundIdx];
    p.dates=p.dates.filter(d=>d!==ds);
    if(!p.dates.length) db.periods.splice(foundIdx,1);
    save(); render(); return;
  }
  const prev=db.periods.find(p=>p.dates.includes(addDays(ds,-1)));
  const next=db.periods.find(p=>p.dates.includes(addDays(ds,1)));
  if(prev && next && prev!==next){
    prev.dates=[...new Set([...prev.dates,...next.dates,ds])].sort();
    db.periods=db.periods.filter(p=>p!==next);
  } else if(prev){
    prev.dates.push(ds); prev.dates.sort();
  } else if(next){
    next.dates.push(ds); next.dates.sort();
  } else {
    db.periods.push({id:uid(),dates:[ds],flow:'',pain:'',note:''});
  }
  save(); render();
}

function buildSummary(question){
  const matched=TOPIC_WORDS.filter(w=>question.includes(w));
  const aboutPeriod=matched.some(w=>['经期','月经','例假','生理期','痛经'].includes(w))||/经期|月经|例假|大姨妈/.test(question);
  const aboutHerb=matched.includes('中药')||matched.includes('调理')||/中药|调理|汤药/.test(question);
  const matchedEvents=db.events.filter(e=>{
    const text=[(e.reasons||[]).join(' '),e.diag,e.exam,e.med,e.feel,e.dept,e.hosp,e.herbFormula||''].join(' ');
    if(matched.length===0){ return /整体|全部|所有|综合|健康|总体/.test(question); }
    return matched.some(w=>text.includes(w));
  });
  const lines=[];
  lines.push('【整理自本地健康档案，已脱敏】');
  lines.push('');
  lines.push('【基本情况】');
  lines.push('女性。'+(aboutPeriod?'关注经期情况。':'')+(aboutHerb?'有中药调理记录。':''));
  lines.push('');
  let hasContent=false;
  if(aboutPeriod){
    const ps=sortedPeriods();
    if(ps.length){
      hasContent=true;
      const recent=ps.slice(-10).reverse();
      lines.push('【经期记录】（共 '+ps.length+' 次，列出最近 '+recent.length+' 次）');
      recent.forEach((p,i)=>{
        const s=perStart(p), e=perEnd(p);
        let sLine='- '+s+(s!==e?' 至 '+e:'')+'，持续 '+p.dates.length+' 天';
        if(p.flow) sLine+='，量'+p.flow;
        if(p.pain) sLine+='，痛经'+p.pain;
        if(p.note) sLine+='。'+p.note;
        if(i<recent.length-1){
          const prev=recent[i+1];
          const gap=diffDays(perEnd(prev),s);
          sLine+='（距上次结束 '+gap+' 天）';
        }
        lines.push(sLine);
      });
      if(ps.length>=3){
        const gaps=[];
        for(let i=1;i<ps.length;i++) gaps.push(diffDays(perEnd(ps[i-1]),perStart(ps[i])));
        const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
        const min=Math.min(...gaps), max=Math.max(...gaps);
        lines.push('间隔统计：平均 '+avg+' 天，最短 '+min+' 天，最长 '+max+' 天。');
      }
      lines.push('');
    }
  }
  if(matchedEvents.length){
    hasContent=true;
    const sorted=matchedEvents.slice().sort((a,b)=>a.date.localeCompare(b.date));
    lines.push('【相关就诊 / 检查记录】（共 '+sorted.length+' 条）');
    sorted.forEach(e=>{
      let s='- '+e.date;
      if(e.reasons && e.reasons.length) s+='，因'+e.reasons.join('、');
      if(e.hosp || e.dept) s+='，'+'就诊某医院'+(e.dept?'（'+e.dept+'）':'');
      if(e.exam) s+='。检查：'+e.exam.replace(/\n/g,'；');
      if(e.diag) s+='。诊断：'+e.diag;
      if(e.med) s+='。用药：'+e.med.replace(/\n/g,'；');
      if(e.herbFormula) s+='。方剂：'+e.herbFormula.replace(/\n/g,'；');
      if(e.feel) s+='。感受：'+e.feel;
      if(e.herb) s+='（含中药调理）';
      lines.push(s);
    });
    lines.push('');
  }
  if(!hasContent){
    lines.push('【整体情况】');
    lines.push('共 '+db.events.length+' 条就诊/体检记录，'+db.periods.length+' 次经期记录。');
    lines.push('');
    if(db.events.length){
      const recent=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
      lines.push('【最近 '+recent.length+' 条记录】');
      recent.forEach(e=>{
        lines.push('- '+e.date+'：'+((e.reasons||[]).join('、')||e.diag||'记录')
          +(e.diag?'（诊断：'+e.diag+'）':''));
      });
      lines.push('');
    }
    if(db.periods.length){
      const ps=sortedPeriods();
      lines.push('【经期汇总】');
      lines.push('共记录 '+ps.length+' 次。最近一次开始于 '+perStart(ps.slice(-1)[0])+'。');
      lines.push('');
    }
  }
  lines.push('---');
  lines.push('请分析：'+question);
  lines.push('（以上信息已去除姓名、具体医院名称等身份标识，如仍需删除其他内容，请自行编辑后再发送。）');
  return lines.join('\n');
}

  const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});

function imp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o.events||!o.periods) throw 0;
      if(confirm('导入 '+o.events.length+' 条事件、'+o.periods.length+' 次经期？\n确定=合并，取消=覆盖')){
        const ids=new Set(db.events.map(x=>x.id));
        o.events.forEach(x=>{if(!ids.has(x.id))db.events.push(x);});
        const pids=new Set(db.periods.map(x=>x.id));
        o.periods.forEach(x=>{if(!pids.has(x.id))db.periods.push(x);});
        if(o.chats && o.chats.length){
          const cids=new Set(db.chats.map(x=>x.id));
          o.chats.forEach(x=>{if(!cids.has(x.id))db.chats.push(x);});
        }
        if(o.messages && o.messages.length){
          const mids=new Set(db.messages.map(x=>x.id));
          o.messages.forEach(x=>{if(!mids.has(x.id))db.messages.push(x);});
        }
      }else{db=o;if(!db.chats)db.chats=[];if(!db.messages)db.messages=[];if(!db.settings)db.settings={remind:true};}
      save();render();alert('导入完成');
    }catch(err){alert('文件格式不对');}
  };
  r.readAsText(f);e.target.value='';
}
function clr(){
  if(!confirm('确定清空全部数据？无法恢复。'))return;
  if(!confirm('再确认一次：真的要清空？'))return;
  db={events:[],periods:[],chats:[],messages:[],settings:{remind:true}};save();render();
}

  editing=ev?ev.id:null;
  const reasons=ev?ev.reasons||[]:[];
  const allReasons=['胃痛','经期不规律','常规体检','腹胀','反酸','头痛','失眠','疲劳','感冒','复查','其他'];
  openP('<h2>'+(ev?'编辑事件':'记录一次事件')+'</h2>'
    +'<div class="grid2">'
    +'<div class="field"><label>日期 *</label><input type="date" id="f_date" value="'+esc(ev?ev.date:todayStr())+'"></div>'
    +'<div class="field"><label>科室</label><input id="f_dept" value="'+esc(ev?ev.dept:'')+'" placeholder="如：消化内科"></div>'
    +'</div>'
    +'<div class="field"><label>医院</label><input id="f_hosp" value="'+esc(ev?ev.hosp:'')+'" placeholder="如：某市第一人民医院"></div>'
    +'<div class="field"><label>这次的原因 / 目的（可多选）</label><div id="chips">'
    +allReasons.map(r=>'<span class="chip'+(reasons.includes(r)?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+r+'</span>').join('')
    +'</div></div>'
    +'<div class="field"><label>补充原因（自由写）</label><input id="f_reason2" value="'+esc(ev?ev.reason2:'')+'" placeholder="不在上面选项里的，写这里"></div>'
    +'<div class="field"><label>检查项目与结果</label><textarea id="f_exam" rows="3">'+esc(ev?ev.exam:'')+'</textarea></div>'
    +'<div class="field"><label>诊断</label><input id="f_diag" value="'+esc(ev?ev.diag:'')+'" placeholder="如：慢性胃炎"></div>'
    +'<div class="field"><label>用药（西药）</label><textarea id="f_med" rows="2">'+esc(ev?ev.med:'')+'</textarea></div>'
    +'<div class="field"><label>我的感受</label><textarea id="f_feel" rows="2">'+esc(ev?ev.feel:'')+'</textarea></div>'
    +'<div class="field"><label><input type="checkbox" id="f_herb" '+(ev&&ev.herb?'checked':'')+' style="width:auto;margin-right:6px">含中药调理</label></div>'
    +'<div class="field"><label>中药方剂（勾选中药时填）</label><textarea id="f_herbformula" rows="2" placeholder="如：柴胡桂枝汤加减，7剂">'+esc(ev?ev.herbFormula||'':'')+'</textarea></div>'
    +'<button class="btn" onclick="saveEv()">保存</button>'
    +'<button class="btn sec" onclick="closeP()">取消</button>');
}
function saveEv(){
  const date=$('f_date').value;
  if(!date){alert('请选日期');return;}
  const reasons=[...document.querySelectorAll('#chips .chip.on')].map(c=>c.textContent);
  const r2=$('f_reason2').value.trim();
  if(r2) reasons.push(r2);
  const isNew=!editing;
  const o={
    id:editing||uid(),
    date:date, dept:$('f_dept').value.trim(), hosp:$('f_hosp').value.trim(),
    reasons:reasons, reason2:'', exam:$('f_exam').value.trim(),
    diag:$('f_diag').value.trim(), med:$('f_med').value.trim(),
    feel:$('f_feel').value.trim(), herb:$('f_herb').checked,
    herbFormula:$('f_herbformula').value.trim()
  };
  if(editing) db.events=db.events.map(x=>x.id===editing?o:x);
  else db.events.push(o);
  if(isNew) checkEventLinks(o);
  save();closeP();render();
}
function editEv(id){const ev=db.events.find(x=>x.id===id);if(ev)evForm(ev);}
function delEv(id){
  if(!confirm('删除这条记录？'))return;
  db.events=db.events.filter(x=>x.id!==id);
  save();render();
}

function perForm(p){
  editing=p?p.id:null;
  const s=perStart(p), e=perEnd(p);
  openP('<h2>编辑经期细节</h2>'
    +'<div class="row" style="color:#8e8e93;font-size:14px;margin-bottom:14px">'
    +fmtDate(s)+(s!==e?' → '+fmtDate(e):'')+'（共 '+p.dates.length+' 天）<br>'
    +'如需修改日期，去日历点选。</div>'
    +'<div class="field"><label>量</label><select id="p_flow">'
    +['','少','中','多'].map(v=>'<option '+(p.flow===v?'selected':'')+'>'+v+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>痛经</label><select id="p_pain">'
    +['无','轻','中','重'].map(v=>'<option '+(p.pain===v?'selected':'')+'>'+v+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>备注（颜色、血块、情绪等）</label><textarea id="p_note" rows="3">'+esc(p.note)+'</textarea></div>'
    +'<button class="btn" onclick="savePer()">保存</button>'
    +'<button class="btn sec" onclick="closeP()">取消</button>');
}
function savePer(){
  const p=db.periods.find(x=>x.id===editing);
  if(!p){closeP();return;}
  p.flow=$('p_flow').value;
  p.pain=$('p_pain').value;
  p.note=$('p_note').value.trim();
  save();closeP();render();
}
function editPer(id){const p=db.periods.find(x=>x.id===id);if(p)perForm(p);}
function delPer(id){if(!confirm('删除这次经期记录？'))return;db.periods=db.periods.filter(x=>x.id!==id);save();render();}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});

checkPeriodRemind();
render();
</script>
</body>
</html>
